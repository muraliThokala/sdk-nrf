# The Wi-Fi and Short-Range coexistence driver under test.
CONFIG_NRF71_SR_COEX_DRIVER=y

# The coexistence driver sits between: the nRF71 Wi-Fi driver owns
# the FMAC transport that carries CD2CM commands to the RPU, and
# the Short-Range (for example, Bluetooth) side of the arbitration.
CONFIG_WIFI=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_BT=y

# The Coexistence Manager command handling lives in the Wi-Fi ROM patch. The
# board overlay points WICR at the patch regions, so the patch must be merged
# into the flashed image.
CONFIG_WIFI_NRF71_PATCH=y

# bt_le_set_chan_map() returns -ENOTSUP unless the Controller is a central or a
# broadcaster, so the BLE bad-channel mapping test needs one of the two roles.
CONFIG_BT_CENTRAL=y

# Networking (Wi-Fi driver build dependency).
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_HEAP_MEM_POOL_SIZE=230000

# IPC transport to the RPU.
CONFIG_IPC_SERVICE_BACKEND_ICMSG_WQ_ENABLE=y
CONFIG_IPC_SERVICE_BACKEND_ICMSG_WQ_STACK_SIZE=5600

# Logging. Immediate mode keeps driver log lines interleaved with the test
# bench printk output in the right order, which matters when reading a failure.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_NRF71_SR_COEX_DRIVER_LOG_LEVEL_DBG=y

# Keep the Wi-Fi driver debug logging off so it does not bury the test bench output.
CONFIG_WIFI_NRF71_LOG_LEVEL_DBG=n

# Set to y to open an MPC override on the Wi-Fi debug register window
# (0x48000000) so a debugger can reach the LMAC/UMAC VPRs. Useful to tell "Wi-Fi
# core never started" apart from "core runs but the ipc0 ICMsg peer never binds",
# because nrf_wifi_fmac_ver_get() is stubbed and its "booted successfully" log
# line does not touch the RPU. Disabled by default.
CONFIG_SOC_NRF71_WIFI_DAP=n

CONFIG_MAIN_STACK_SIZE=8192
