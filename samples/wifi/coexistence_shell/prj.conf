CONFIG_WIFI=y
CONFIG_WIFI_NRF70=n
CONFIG_NRF70_SR_COEX=n
CONFIG_NRF70_SR_COEX_RF_SWITCH=n

# WPA supplicant
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_LOG_LEVEL_INF=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOG=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y

CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=4
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=5

# Zephyr NET Connection Manager Connectivity layer.
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_L2_WIFI_CONNECTIVITY=y
CONFIG_L2_WIFI_CONNECTIVITY_AUTO_CONNECT=n
CONFIG_L2_WIFI_CONNECTIVITY_AUTO_DOWN=n
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=5000

# printing of scan results puts pressure on queues in new locking
# design in net_mgmt. So, use a higher timeout for a crowded
# environment.
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_ZVFS_POLL_MAX=12

CONFIG_POSIX_API=y

CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_WIFI=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=2
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_CONTEXT_SYNC_RECV=y

CONFIG_INIT_STACKS=y

CONFIG_NET_L2_ETHERNET=y

CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y

# Wi-Fi is the default interface. main() calls net_config_init_app() on it,
# which assigns the static address and starts DHCP. The timeout of 0 keeps
# main() from blocking while it waits.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# main() already calls net_config_init_app() on the Wi-Fi interface, so
# skip the automatic call at boot.
CONFIG_NET_CONFIG_AUTO_INIT=n

# Bring the Wi-Fi interface up at boot so the supplicant attaches to it and
# "wifi connect" works without "net iface up 1".
CONFIG_NRF_WIFI_IF_AUTO_START=y

# Restrict the RPU to 5 GHz so it never operates on the band shared with BT.
CONFIG_NRF_WIFI_5G_BAND=y

# Memories
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_SHELL_STACK_SIZE=5200
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096

CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_BT_LONG_WQ_STACK_SIZE=2560

# Debugging
CONFIG_STACK_SENTINEL=y
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y

# Kernel options
CONFIG_ENTROPY_GENERATOR=y

# Logging
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_SHELL=y
CONFIG_SHELL_GETOPT=y
CONFIG_DEVICE_SHELL=y
CONFIG_POSIX_TIMERS=y

# Benchmarking
CONFIG_NET_ZPERF=y
CONFIG_NET_ZPERF_MAX_PACKET_SIZE=1024
CONFIG_ZVFS_OPEN_MAX=16

# Optimized networking settings for performance
CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=24

# The nRF70 driver defaults to variable-size net bufs to save RAM, which can split
# an IPv4/UDP header across fragments. Fixed-size buffers keep headers contiguous.
CONFIG_NRF_WIFI_USE_VARIABLE_NET_BUFS=n
CONFIG_NET_BUF_FIXED_DATA_SIZE=y
CONFIG_NET_BUF_DATA_SIZE=1600

CONFIG_HEAP_MEM_POOL_SIZE=41808
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=20000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=168192

CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_STATIC=y
CONFIG_WIFI_CREDENTIALS_STATIC_SSID="Myssid"
CONFIG_WIFI_CREDENTIALS_STATIC_PASSWORD="Mypassword"

CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.99"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.1"

# The nRF70 TX queue, aggregation, token and QSPI low power defaults are set in
# Kconfig so they only apply when CONFIG_WIFI_NRF70 is enabled.

CONFIG_MBEDTLS_HEAP_SIZE=1024

# Bluetooth LE parameters
CONFIG_BT_DEVICE_NAME="Nordic_Throughput"
CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_MAX_CONN=2

CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_BT_SCAN_UUID_CNT=1

CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_THROUGHPUT=y

CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y

# The sample drives the PHY update itself. Leaving the host's automatic update
# enabled makes both run at connection, and the second one gets 0x3a (busy).
CONFIG_BT_AUTO_PHY_CENTRAL_NONE=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n

# Interval applied for the throughput run. On nrf7120dk anything longer loses
# most packets: 24 units (30 ms) managed 3 kbps and 80 units (100 ms) drops the
# link. 6 units matches the setup interval, so no parameter update is needed.
CONFIG_INTERVAL_MIN=6
CONFIG_INTERVAL_MAX=6

CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_ATT_PREPARE_COUNT=2

CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_L2CAP_TX_MTU=498

CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y

# Added to fix BLE crash in coex enable cases.
CONFIG_NRF_RPC=n
CONFIG_NRF_RPC_CBOR=n
# New Bluetooth configurations
CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_BT_BONDABLE=n
CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_ATT_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=11
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_ACL_TX_SIZE=502

# The Bluetooth LE controller data length and PHY defaults are set in Kconfig so
# they only apply to the image that contains the controller.

# Frame Space Update renegotiates T_IFS.
CONFIG_BT_FRAME_SPACE_UPDATE=n
CONFIG_BT_LE_EXTENDED_FEAT_SET=n

# Set to y (with CONFIG_THREAD_ANALYZER_AUTO=y) to print thread stack usage.
# Use CONFIG_THREAD_ANALYZER_AUTO_INTERVAL (in seconds) to control the interval
# between the two successive prints.
CONFIG_THREAD_ANALYZER=n
