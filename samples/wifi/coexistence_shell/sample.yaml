sample:
  description: Wi-Fi and Short-Range coexistence shell sample
  name: Wi-Fi and SR coex shell
tests:
  sample.nrf7120.ble_coex_shell:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf7120dk/nrf7120/cpuapp
    extra_args:
      - SB_CONFIG_WIFI_NRF70=n
      - CONFIG_WIFI_NRF71_PATCH=y
    platform_allow: nrf7120dk/nrf7120/cpuapp
    tags:
      - ci_build
      - sysbuild
      - ci_samples_nrf71_wifi
